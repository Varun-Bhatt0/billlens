version: 2
updates:
  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # NuGet packages (packages.config for the web app, PackageReference for the tests)
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Pinned: newer versions pull in System.Memory and friends on .NET Framework 4.8
      - dependency-name: "BCrypt.Net-Next"
